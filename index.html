<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>まいにちピアノすごろく（クリスマス編）</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #edf3ec;
        --card: #ffffff;
        --card-soft: #f6faf3;
        --ink: #22392e;
        --muted: #5d7466;
        --pine: #1e6b4f;
        --pine-deep: #14503a;
        --pine-soft: #dcefe2;
        --red: #c23b2e;
        --red-deep: #a02c21;
        --gold: #d9a441;
        --gold-deep: #b9822c;
        --gold-soft: #fbeecd;
        --cell: #fffef9;
        --cell-done: #e3f1de;
        --cell-line: #d9e4d4;
        --reward-bg: #fdf0cd;
        --staff-line: #9db8a4;
        --flake: #c3d8e8;
        --shadow: 0 4px 14px rgba(20, 80, 58, 0.13);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c231b;
          --card: #173a2c;
          --card-soft: #1d4433;
          --ink: #f0f6ef;
          --muted: #aac6b5;
          --pine: #43a97c;
          --pine-deep: #7cc9a4;
          --pine-soft: #20493a;
          --red: #e8735f;
          --red-deep: #f0927f;
          --gold: #e7bc5e;
          --gold-deep: #e7bc5e;
          --gold-soft: #4a3a14;
          --cell: #1d4534;
          --cell-done: #2a5c40;
          --cell-line: #2e5a44;
          --reward-bg: #54431a;
          --staff-line: #5d8a70;
          --flake: #9db9c9;
          --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro",
          "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-text-size-adjust: 100%;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        min-height: 2.75rem;
        border: none;
        background: none;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible, [tabindex]:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 44rem;
        margin: 0 auto;
        padding: 1rem 1rem 2.5rem;
        position: relative;
        z-index: 1;
      }
      /* ---------- snow ---------- */
      #snowLayer {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }
      .snow {
        position: absolute;
        top: -3vh;
        border-radius: 50%;
        background: var(--flake);
        opacity: 0.75;
        animation-name: snowfall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      @keyframes snowfall {
        to { transform: translateY(108vh); }
      }
      /* ---------- header ---------- */
      header { text-align: center; padding: 0.6rem 0 0.2rem; }
      .title-row {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 0.4rem;
      }
      .title-row svg { flex: none; margin-top: 0.35rem; }
      h1 {
        font-size: clamp(1.45rem, 6vw, 2.1rem);
        line-height: 1.3;
        margin: 0;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      h1 .sub {
        display: block;
        font-size: 0.52em;
        color: var(--red);
        letter-spacing: 0.14em;
        margin-bottom: 0.15em;
      }
      .lead {
        color: var(--muted);
        font-size: 0.95rem;
        margin: 0.45rem 0 0;
        line-height: 1.6;
      }
      /* ---------- cards ---------- */
      .card {
        background: var(--card);
        border-radius: 1.1rem;
        box-shadow: var(--shadow);
        padding: 1rem 1rem 1.1rem;
        margin-top: 1rem;
      }
      .card h2 {
        font-size: 1.05rem;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.45rem;
        font-weight: 800;
      }
      .card h2 .note-badge {
        background: var(--red);
        color: #fff;
        font-size: 0.72rem;
        padding: 0.18rem 0.55rem;
        border-radius: 999px;
        letter-spacing: 0.06em;
      }
      /* ---------- carol staff ---------- */
      #staffSvg { width: 100%; height: auto; display: block; margin-top: 0.4rem; }
      #staffSvg .staff-line { stroke: var(--staff-line); stroke-width: 1.6; }
      #staffSvg .note-head { fill: var(--pine-deep); }
      #staffSvg .note-stem { stroke: var(--pine-deep); stroke-width: 2; }
      #staffSvg .note-ghost .note-head { fill: var(--staff-line); opacity: 0.35; }
      #staffSvg .note-ghost .note-stem { stroke: var(--staff-line); opacity: 0.35; }
      #staffSvg .note-open .note-head { fill: var(--card); stroke: var(--pine-deep); stroke-width: 2.2; }
      #staffSvg .solfa { fill: var(--muted); font-size: 13px; text-anchor: middle; font-weight: 700; }
      #staffSvg .note-ghost .solfa { opacity: 0; }
      #staffSvg g.note { cursor: pointer; }
      #staffSvg g.note.playing .note-head { fill: var(--red); }
      #staffSvg g.note.playing .note-stem { stroke: var(--red); }
      #staffSvg g.note.new-note {
        transform-box: fill-box;
        transform-origin: center;
        animation: notePop 0.7s ease;
      }
      @keyframes notePop {
        0% { transform: scale(0.2) rotate(-24deg); }
        55% { transform: scale(1.5) rotate(8deg); }
        100% { transform: scale(1) rotate(0deg); }
      }
      .carol-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin-top: 0.35rem;
      }
      #carolProgress { font-size: 0.92rem; color: var(--muted); font-weight: 700; }
      .btn-listen {
        background: var(--pine-soft);
        color: var(--pine-deep);
        font-weight: 800;
        font-size: 0.92rem;
        border-radius: 999px;
        padding: 0.45rem 1rem;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .btn-listen:disabled { opacity: 0.45; cursor: default; }
      /* ---------- board ---------- */
      #boardWrap { position: relative; margin-top: 0.7rem; }
      #startPad {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: var(--pine-soft);
        color: var(--pine-deep);
        font-weight: 800;
        font-size: 0.85rem;
        border-radius: 999px;
        padding: 0.4rem 0.9rem 0.4rem 0.6rem;
        margin-bottom: 0.55rem;
      }
      #startPad .dot {
        width: 0.7rem; height: 0.7rem; border-radius: 50%;
        background: var(--pine);
        display: inline-block;
      }
      #board {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.45rem;
      }
      .cell {
        position: relative;
        aspect-ratio: 1 / 1;
        background: var(--cell);
        border: 2px solid var(--cell-line);
        border-radius: 0.85rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.05rem;
      }
      .cell .dnum { font-size: clamp(1.05rem, 5.2vw, 1.5rem); font-weight: 800; line-height: 1; }
      .cell .dlabel { font-size: 0.6rem; color: var(--muted); font-weight: 700; letter-spacing: 0.04em; }
      .cell .ricon { position: absolute; top: 0.16rem; right: 0.18rem; width: 15px; height: 15px; opacity: 0.55; }
      .cell.done { background: var(--cell-done); border-color: var(--pine); }
      .cell.done .dnum { color: var(--pine-deep); }
      .cell.reward { background: var(--reward-bg); border-color: var(--gold); }
      .cell.reward .ricon { opacity: 1; }
      .cell.reward.got .ricon { filter: drop-shadow(0 0 4px var(--gold)); }
      .cell.goal { background: var(--reward-bg); border-color: var(--red); }
      .cell.now { box-shadow: 0 0 0 3px var(--gold), var(--shadow); }
      .cell .check {
        position: absolute;
        bottom: 0.18rem;
        right: 0.3rem;
        color: var(--pine);
        font-weight: 900;
        font-size: 0.8rem;
        display: none;
      }
      .cell.done .check { display: block; }
      .cell .again {
        position: absolute;
        top: 0.14rem;
        left: 0.14rem;
        display: none;
        background: var(--pine);
        color: #fff;
        font-size: 0.5rem;
        font-weight: 900;
        letter-spacing: 0.02em;
        padding: 0.12rem 0.34rem;
        border-radius: 999px;
        line-height: 1.2;
      }
      .cell.replay { cursor: pointer; }
      .cell.replay .again { display: block; }
      .cell.replay:hover { box-shadow: 0 0 0 3px var(--pine-soft), var(--shadow); }
      .board-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.6rem;
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--muted);
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      #posLabel { color: var(--pine-deep); font-size: 1rem; }
      /* ---------- main button & message ---------- */
      .play-area { text-align: center; margin-top: 1.1rem; }
      #message {
        min-height: 1.7em;
        font-size: 1.08rem;
        font-weight: 800;
        color: var(--pine-deep);
        margin: 0 0 0.6rem;
        line-height: 1.5;
      }
      #btnPlay {
        background: linear-gradient(180deg, #d84c3a, var(--red) 55%, var(--red-deep));
        color: #fff;
        font-size: clamp(1.25rem, 5.6vw, 1.6rem);
        font-weight: 900;
        letter-spacing: 0.04em;
        border-radius: 999px;
        padding: 0.9rem 2rem;
        min-height: 4rem;
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        box-shadow: 0 6px 0 var(--red-deep), 0 10px 18px rgba(160, 44, 33, 0.3);
        transition: transform 0.08s ease, box-shadow 0.08s ease;
        max-width: 100%;
      }
      #btnPlay:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--red-deep), 0 5px 10px rgba(160, 44, 33, 0.3);
      }
      #btnPlay:disabled { opacity: 0.55; cursor: default; }
      #btnPlay .keys-icon { flex: none; }
      .play-note { color: var(--muted); font-size: 0.85rem; margin: 0.6rem 0 0; }
      /* ---------- reset ---------- */
      .footer-row { text-align: center; margin-top: 2rem; }
      #btnReset {
        color: var(--muted);
        font-size: 0.82rem;
        text-decoration: underline;
        text-underline-offset: 3px;
        padding: 0.5rem 1rem;
      }
      /* ---------- modal ---------- */
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 30, 22, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 50;
      }
      #overlay.open { display: flex; }
      .modal {
        background: var(--card);
        border-radius: 1.2rem;
        max-width: 26rem;
        width: 100%;
        max-height: 88vh;
        overflow-y: auto;
        padding: 1.3rem 1.2rem 1.2rem;
        text-align: center;
        position: relative;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
      }
      .modal h3 { margin: 0 0 0.4rem; font-size: 1.25rem; font-weight: 900; }
      .modal p { line-height: 1.65; margin: 0.4rem 0; }
      .modal .big-emoji-art { margin: 0.4rem auto; display: block; }
      .btn-main {
        background: var(--pine);
        color: #fff;
        font-weight: 900;
        font-size: 1.05rem;
        border-radius: 999px;
        padding: 0.7rem 1.7rem;
        margin-top: 0.7rem;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        box-shadow: 0 4px 0 var(--pine-deep);
      }
      .btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pine-deep); }
      .btn-sub {
        background: var(--pine-soft);
        color: var(--pine-deep);
        font-weight: 800;
        border-radius: 999px;
        padding: 0.6rem 1.3rem;
        margin-top: 0.7rem;
      }
      .btn-danger {
        background: var(--red);
        color: #fff;
        font-weight: 900;
        border-radius: 999px;
        padding: 0.7rem 1.5rem;
        margin-top: 0.7rem;
        box-shadow: 0 4px 0 var(--red-deep);
      }
      .modal-btns { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
      .burst-zone { position: relative; overflow: hidden; min-height: 7rem; }
      .burst-star {
        position: absolute;
        pointer-events: none;
        clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
      }
      .modal-flake {
        position: absolute;
        border-radius: 50%;
        background: var(--flake);
        pointer-events: none;
      }
      /* free piano */
      #freePiano { display: flex; gap: 0.3rem; justify-content: center; margin-top: 0.8rem; }
      #freePiano button {
        flex: 1;
        max-width: 3rem;
        height: 6.2rem;
        border-radius: 0 0 0.6rem 0.6rem;
        font-weight: 900;
        font-size: 0.95rem;
        color: #22392e;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 0.5rem;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
        position: relative;
      }
      #freePiano button:active { transform: translateY(3px); box-shadow: none; }
      /* high-low bells */
      .bell-row { display: flex; gap: 0.8rem; justify-content: center; margin-top: 0.8rem; }
      .bell-btn {
        background: var(--gold-soft);
        border: 3px solid var(--gold);
        border-radius: 1rem;
        padding: 0.8rem 0.6rem 0.6rem;
        font-weight: 900;
        font-size: 0.95rem;
        color: var(--ink);
        flex: 1;
        max-width: 9.5rem;
      }
      .bell-btn:active { transform: scale(0.96); }
      .bell-btn.right { background: var(--pine); border-color: var(--pine-deep); color: #fff; }
      .present-btn { padding: 0.5rem; border-radius: 1rem; }
      .present-btn:active { transform: scale(0.95); }
      .reward-msg { font-size: 1.12rem; font-weight: 900; color: var(--pine-deep); min-height: 1.6em; }
      /* ---------- advent flip cells ---------- */
      button.cell { padding: 0; font: inherit; color: inherit; text-align: center; }
      .cell-inner {
        position: relative; width: 100%; height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.65s cubic-bezier(0.34, 1.2, 0.5, 1);
        display: block;
      }
      .cell.opened .cell-inner { transform: rotateY(180deg); }
      .cell-face {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 0.05rem; border-radius: inherit;
        backface-visibility: hidden; -webkit-backface-visibility: hidden;
      }
      .cell-back { transform: rotateY(180deg); background: var(--cell-done); }
      .cell-back .rart { width: 46%; height: 46%; }
      .cell-back .rname { font-size: clamp(0.5rem, 2.4vw, 0.68rem); font-weight: 800; color: var(--pine-deep); line-height: 1.15; }
      .cell.next { cursor: pointer; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), var(--shadow); animation: cellPulse 1.4s ease-in-out infinite; }
      @keyframes cellPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      .cell:disabled { cursor: default; }
      .tap-hint { text-align: center; color: var(--muted); font-size: 0.92rem; font-weight: 700; margin: 0.7rem 0 0; line-height: 1.6; }
      /* ---------- sticker shelf ---------- */
      #stickerRow { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 0.7rem; }
      .sticker {
        position: relative; width: 4.4rem; padding: 0.55rem 0.3rem 0.4rem;
        background: var(--card-soft); border: 2px dashed var(--gold);
        border-radius: 0.7rem; text-align: center;
        box-shadow: var(--shadow);
      }
      .sticker::before {
        content: ""; position: absolute; top: -0.45rem; left: 50%;
        transform: translateX(-50%) rotate(-3deg);
        width: 1.7rem; height: 0.75rem;
        background: var(--gold-soft); border: 1px solid var(--gold);
        border-radius: 0.15rem; opacity: 0.9;
      }
      .sticker svg { display: block; margin: 0 auto; }
      .sticker .sname { display: block; font-size: 0.58rem; font-weight: 800; color: var(--muted); margin-top: 0.2rem; line-height: 1.2; }
      .sticker.sticker-big {
        width: 6.2rem;
        padding: 0.8rem 0.4rem 0.55rem;
        border: 3px solid var(--gold);
        background: var(--gold-soft);
      }
      .sticker.sticker-big .sname { font-size: 0.66rem; color: var(--gold-deep); }
      #stickerEmpty { color: var(--muted); font-size: 0.9rem; margin: 0.6rem 0 0; }
      /* ---------- snow storm ---------- */
      #snowStorm { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 80; display: none; }
      #snowStorm.on { display: block; }
      .storm-flake { position: absolute; top: -4vh; border-radius: 50%; background: #eaf4fb; box-shadow: 0 0 6px rgba(255,255,255,0.8); }
      #btnStopSnow {
        position: fixed; left: 50%; bottom: 1.4rem; transform: translateX(-50%);
        z-index: 81; pointer-events: auto;
        background: var(--pine); color: #fff; font-weight: 900; font-size: 1rem;
        border-radius: 999px; padding: 0.7rem 1.6rem; box-shadow: 0 4px 0 var(--pine-deep);
        display: none;
      }
      #btnStopSnow.on { display: inline-flex; }
      /* ---------- simon bells ---------- */
      .simon-bells { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-top: 0.8rem; }
      .simon-bell {
        border-radius: 1.1rem; padding: 0.7rem 0.4rem 0.55rem;
        font-weight: 900; font-size: 0.9rem; color: #22392e;
        border: 3px solid rgba(0,0,0,0.12);
        transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
      }
      .simon-bell svg { display: block; margin: 0 auto 0.15rem; }
      .simon-bell.lit { transform: scale(1.1); filter: brightness(1.45); box-shadow: 0 0 0 4px var(--gold), 0 0 22px var(--gold); }
      .simon-bell:active { transform: scale(0.96); }
      /* ---------- goal certificate & fireworks ---------- */
      .certificate {
        border: 3px solid var(--gold); border-radius: 0.6rem;
        background: var(--gold-soft); padding: 1rem 0.8rem 0.9rem; margin-top: 0.8rem;
        position: relative;
      }
      .certificate::before { content: ""; position: absolute; inset: 5px; border: 1.5px solid var(--gold); border-radius: 0.4rem; pointer-events: none; }
      .certificate .c-title { font-size: 0.78rem; letter-spacing: 0.3em; color: var(--gold-deep); font-weight: 900; }
      .certificate .c-main { font-size: 1.35rem; font-weight: 900; color: var(--pine-deep); margin: 0.35rem 0; }
      .certificate p { font-size: 0.9rem; margin: 0.25rem 0; }
      .santa-msg {
        background: var(--pine-soft); border-radius: 0.9rem;
        padding: 0.8rem 0.9rem; margin-top: 0.8rem; text-align: left;
        font-size: 0.95rem; line-height: 1.7;
      }
      .santa-msg .from { display: block; text-align: right; font-weight: 900; color: var(--red); margin-top: 0.3rem; }
      .fw-anchor { position: absolute; width: 2px; height: 2px; pointer-events: none; }
      .fw-dot { position: absolute; border-radius: 50%; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        .snow { display: none; }
        #staffSvg g.note.new-note { animation: none; }
        .cell-inner { transition: none; }
        .cell.next { animation: none; }
      }
    </style>
  </head>

    <!-- SVG sprite: all artwork is drawn in-file, no external images -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-tree" viewBox="0 0 48 48">
          <path d="M24 3 L33 15 H28.5 L37 26 H31.5 L40 37 H8 L16.5 26 H11 L19.5 15 H15 Z" fill="#2e7d54"/>

          <circle cx="19" cy="22" r="2.1" fill="#c23b2e"/>
          <circle cx="29" cy="29" r="2.1" fill="#d9a441"/>
          <circle cx="24" cy="33" r="2.1" fill="#c23b2e"/>
        </symbol>
        <symbol id="i-gift" viewBox="0 0 48 48">
          <rect x="7" y="20" width="34" height="22" rx="2.5" fill="#c23b2e"/>
          <rect x="21.5" y="20" width="5" height="22" fill="#e7bc5e"/>
          <rect x="4.5" y="13" width="39" height="8.5" rx="2.5" fill="#a02c21"/>
          <rect x="21.5" y="13" width="5" height="8.5" fill="#d9a441"/>
          <path d="M24 13 C17 13 14.5 9.5 16.2 6.8 C17.8 4.3 22.5 5.6 24 10 C25.5 5.6 30.2 4.3 31.8 6.8 C33.5 9.5 31 13 24 13 Z" fill="#e7bc5e"/>
        </symbol>
        <symbol id="i-star" viewBox="0 0 48 48">
          <path d="M24 3 l6.2 13.4 14.7 1.6 -10.9 10 3 14.4 -13 -7.4 -13 7.4 3 -14.4 -10.9 -10 14.7 -1.6 Z" fill="#e7bc5e" stroke="#b9822c" stroke-width="2" stroke-linejoin="round"/>
        </symbol>

          '<p>ベルが ひかって なる じゅんばんを おぼえて、<br />おなじ じゅんばんに タッチしてね。<br />まちがえても だいじょうぶ。なんどでも できるよ！</p>' +
          '<div class="simon-bells">' + bells + '</div>' +
          '<p class="reward-msg" id="simonMsg"></p>' +
          '<div class="modal-btns">' +
          '<button type="button" class="btn-main" id="btnSimonStart">ゲーム スタート</button>' +
          '<button type="button" class="btn-sub" id="btnSimonHear">もういちど きく</button>' +
          '<button type="button" class="btn-sub" data-close>とじる</button></div>'
        );
        simon = { len: 2, seq: [], pos: 0, phase: "idle" };
        modalBody.querySelectorAll(".simon-bell").forEach(function (btn) {
          btn.addEventListener("click", function () {
            simonTap(parseInt(btn.getAttribute("data-i"), 10));
          });
        });
        document.getElementById("btnSimonStart").addEventListener("click", function () {
          simon.len = 2;
          simonRound();
        });
        document.getElementById("btnSimonHear").addEventListener("click", function () {
          if (simon && simon.phase === "input") playSimonSeq();
        });
        wireClose();
      }
      function lightBell(i, dur) {
        var btn = modalBody.querySelector('.simon-bell[data-i="' + i + '"]');
        if (!btn) return;
        btn.classList.add("lit");
        setTimeout(function () { btn.classList.remove("lit"); }, dur || 380);
      }
      function simonRound() {
        simon.seq = [];
        for (var i = 0; i < simon.len; i++) simon.seq.push(Math.floor(Math.random() * 4));
        simon.pos = 0;
        playSimonSeq();
      }
      function playSimonSeq() {
        if (!simon || !simon.seq.length) return;
        simon.phase = "show";
        simon.pos = 0;
        var msg = document.getElementById("simonMsg");
        if (msg) msg.textContent = "よく みて、きいてね…";
        simon.seq.forEach(function (bi, k) {
          setTimeout(function () {
            bellTone(SIMON_BELLS[bi].f, 0);
            lightBell(bi, 400);
          }, 500 + k * 620);
        });
        setTimeout(function () {
          if (!simon) return;
          simon.phase = "input";
          var m = document.getElementById("simonMsg");
          if (m) m.textContent = "まねっこして タッチしてね（" + simon.len + "つ）";
        }, 500 + simon.seq.length * 620 + 150);
      }
      function simonTap(i) {
        bellTone(SIMON_BELLS[i].f, 0);
        lightBell(i, 300);
        if (!simon || simon.phase !== "input") return;
        var msg = document.getElementById("simonMsg");
        if (i === simon.seq[simon.pos]) {
          simon.pos++;
          if (simon.pos >= simon.seq.length) {
            simon.phase = "done";
            markReward(10);
            fanfare();
            burst(modalBody, 14, ["#e7bc5e", "#c23b2e", "#43a97c"]);
            if (simon.len >= 5) {
              msg.textContent = "かんぺき！ 5つまで できたね、すごい！";
            } else {
              msg.textContent = "せいかい！ つぎは " + (simon.len + 1) + "つに チャレンジ！";
              simon.len++;
              setTimeout(function () { if (simon) simonRound(); }, 1400);
            }
          }
        } else {
          // まちがえても失敗にしない：やさしく知らせて、同じ順番をもう一度見せる
          simon.phase = "show";
          msg.textContent = "おしい！ だいじょうぶ。もういちど みてみよう";
          setTimeout(function () { if (simon) playSimonSeq(); }, 1100);
        }
      }
      /* ---- reward: day 15, free piano ---- */
      function openPiano() {
        markReward(15);
        var keys = "";
        SCALE.forEach(function (n) {
          keys += '<button type="button" data-f="' + n.f + '" style="background:' + n.c + '">' + n.s + '</button>';
        });
        openModal(
          '<h3 id="modalTitle">じゆうピアノ ごほうびマス</h3>' +
          '<p>すきな けんばんを、すきなだけ ひいてね。<br />まちがいは ないよ！</p>' +
          '<div id="freePiano" class="burst-zone">' + keys + '</div>' +
          '<div class="modal-btns"><button type="button" class="btn-sub" data-close>とじる</button></div>'
        );
        var btns = modalBody.querySelectorAll("#freePiano button");
        btns.forEach(function (b) {
          b.addEventListener("click", function () {
            pianoNote(parseFloat(b.getAttribute("data-f")), 0);
            tone(2637.02, 0.02, 0.4, "sine", 0.08);
            burst(b.parentElement, 3, ["#e7bc5e", "#f2a9d8", "#9fd8c9"]);
          });
        });
        wireClose();
      }
      /* ---- reward: day 20, present lottery ---- */
      function openPresent() {
        openModal(
          '<h3 id="modalTitle">プレゼント ごほうびマス</h3>' +
          '<p>プレゼントを タップして あけてみよう！</p>' +
          '<div class="burst-zone" id="presentZone">' +
          '<button type="button" class="present-btn" id="btnPresent" aria-label="プレゼントをあける">' +
          '<svg width="110" height="110" aria-hidden="true"><use href="#i-gift"/></svg></button>' +
          '<p class="reward-msg" id="presentMsg"></p></div>' +
          '<div class="modal-btns"><button type="button" class="btn-sub" data-close>とじる</button></div>'
        );
        document.getElementById("btnPresent").addEventListener("click", function () {
          var alreadyGot = !!state.rewards[20];
          var item = PRESENTS[Math.floor(Math.random() * PRESENTS.length)];
          if (!alreadyGot) {
            markReward(20);
            if (state.stickers.indexOf(item.art) === -1) {
              state.stickers.push(item.art);
              save();
              renderStickers();
            }
          }
          fanfare();
          document.getElementById("presentMsg").innerHTML =
            '<svg width="44" height="44" style="vertical-align:-12px" aria-hidden="true"><use href="#i-' + item.art + '"/></svg> ' + item.text +
            (alreadyGot
              ? '<br />ステッカーは さいしょの 1まいが メイン画面に はってあるよ。なんどでも あけられるよ！'
              : '<br />ステッカーは メイン画面に はったよ！');
          burst(document.getElementById("presentZone"), 16, ["#e7bc5e", "#c23b2e", "#43a97c"]);
          this.animate(
            [{ transform: "scale(1)" }, { transform: "scale(1.18) rotate(-4deg)" }, { transform: "scale(1)" }],
            { duration: 450, easing: "ease-out" }
          );
        });
        wireClose();
      }
      /* ---- goal: day 25 ---- */
      function launchFireworks(zone) {
        if (reduceMotion || !zone) return;
        var colors = ["#e7bc5e", "#c23b2e", "#43a97c", "#f2a9d8", "#7fb2e5"];
        for (var round = 0; round < 5; round++) {
          (function (r) {
            setTimeout(function () {
              if (!document.body.contains(zone)) return;
              var cx = 12 + Math.random() * 76, cy = 8 + Math.random() * 30;
              for (var i = 0; i < 16; i++) {
                var dot = document.createElement("span");
                dot.className = "fw-dot";
                var sz = 5 + Math.random() * 6;
                dot.style.width = sz + "px"; dot.style.height = sz + "px";
                dot.style.left = cx + "%"; dot.style.top = cy + "%";
                dot.style.background = colors[(i + r) % colors.length];
                zone.appendChild(dot);
                var ang = (i / 16) * Math.PI * 2 + Math.random() * 0.3;
                var dist = 46 + Math.random() * 62;
                var anim = dot.animate([
                  { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
                  { transform: "translate(" + (Math.cos(ang) * dist - sz / 2) + "px," + (Math.sin(ang) * dist + 26) + "px) scale(0.3)", opacity: 0 }
                ], { duration: 950 + Math.random() * 450, easing: "cubic-bezier(.15,.7,.4,1)" });
                if (anim) anim.onfinish = (function (el) { return function () { el.remove(); }; })(dot);
                else setTimeout(function (el) { el.remove(); }, 1400, dot);
              }
            }, r * 650);
          })(round);
        }
      }
      function openGoal() {
        markReward(25);
        awardSticker(GOAL_STICKER.art);
        openModal(
          '<h3 id="modalTitle">ゴール！ メリークリスマス！</h3>' +
          '<div class="burst-zone" id="goalZone">' +
          '<svg class="big-emoji-art" width="104" height="104" aria-hidden="true"><use href="#i-tree"/></svg>' +
          '<p>25にち、まいにち がんばったね！<br />「ジングルベル」が かんせいしたよ。</p>' +
          '<p class="reward-msg">ゴールの とくべつ ステッカーを もらったよ！</p>' +
          '<svg width="118" height="118" aria-hidden="true"><use href="#i-special"/></svg>' +
          '<p>おおきな「とくべつ ステッカー」は<br />メイン画面の「あつめた ステッカー」に はったよ。</p></div>' +
          '<div class="certificate">' +
          '<div class="c-title">ひょうしょうじょう</div>' +
          '<div class="c-main">よく がんばったね！</div>' +
          '<p>まいにち ピアノを ひいて、25にちの ゴールまで<br />すすむことが できました。</p>' +
          '<p>2026ねん 12がつ25にち</p></div>' +
          '<div class="santa-msg">まいにち コツコツ ひく すがたを、そらから ずっと みていたよ。すてきな「ジングルベル」を ありがとう。らいねんも いっしょに おんがくを たのしもうね。' +
          '<span class="from">サンタさんより</span></div>' +
          '<div class="modal-btns">' +
          '<button type="button" class="btn-main" id="btnGoalPlay">かんせいした キャロルを きく</button>' +
          '<button type="button" class="btn-sub" data-close>とじる</button></div>'
        );
        launchFireworks(document.getElementById("goalZone"));
        document.getElementById("btnGoalPlay").addEventListener("click", function () { playCarol(25); });
        wireClose();
        setTimeout(function () { playCarol(25); }, 500);
      }
      function wireClose() {
        modalBody.querySelectorAll("[data-close]").forEach(function (b) {
          b.addEventListener("click", closeModal);
        });
      }
      /* ---- sticker days: 21-24 ---- */
      function openStickerDay(day) {
        var st = DAILY_STICKERS[day];
        if (!st) return;
        awardSticker(st.art);
        openModal(
          '<h3 id="modalTitle">ステッカー ゲット！</h3>' +
          '<div class="burst-zone" id="stickerZone">' +
          '<svg class="big-emoji-art" width="104" height="104" aria-hidden="true"><use href="#i-' + st.art + '"/></svg>' +
          '<p class="reward-msg">' + st.name + 'が でてきた！</p>' +
          '<p>メイン画面の「あつめた ステッカー」に はったよ。<br />あしたも たのしみにしてね！</p></div>' +
          '<div class="modal-btns"><button type="button" class="btn-main" data-close>やったね！</button></div>'
        );
        fanfare();
        burst(document.getElementById("stickerZone"), 16, ["#e7bc5e", "#c23b2e", "#43a97c"]);
        wireClose();
      }
      function openReward(day) {
        if (day === 5) openSnow();
        else if (day === 10) openBell();
        else if (day === 15) openPiano();
        else if (day === 20) openPresent();
        else if (day === 25) openGoal();
      }

      /* ================= main flow ================= */
      var busy = false;
      var msgEl = document.getElementById("message");
      function setMessage(t) { msgEl.textContent = t; }
      function onCellTap(day) {
        if (busy) return;
        // 開いた特別マスは、何度でもタップして遊べる（進み具合は変わらない）
        if (state.opened[day] && (REWARDS[day] || day === 25)) {
          ac();
          openReward(day);
          return;
        }
        if (day !== state.pos + 1 || state.pos >= 25) return;
        busy = true;
        ac();
        state.pos += 1;
        state.opened[day] = true;
        save();
        sparkle(false);
        var newIdx = state.pos - 1;
        setTimeout(function () { pianoNote(CAROL[newIdx].f, 0); }, 300);
        renderBoard();
        renderStaff(newIdx);
        var rv = REVEALS[day - 1];
        if (day === 25) {
          setMessage("ゴール！！ 25にち たっせい！");
          setTimeout(function () { sparkle(true); openGoal(); busy = false; }, 1250);
        } else if (REWARDS[day]) {
          setMessage(rv.name + "が でたよ！ ごほうびマスにも とうちゃく！");
          setTimeout(function () { openReward(day); busy = false; }, 1250);
        } else if (DAILY_STICKERS[day]) {
          setMessage(rv.name + "が でたよ！ ステッカーも ゲット！");
          setTimeout(function () { openStickerDay(day); busy = false; }, 1250);
        } else {
          setMessage(rv.name + "が でたよ！ " + MESSAGES[(day - 1) % MESSAGES.length]);
          setTimeout(function () { busy = false; }, 750);
        }
      }
      document.getElementById("btnListen").addEventListener("click", function () { playCarol(state.pos); });

      /* ================= reset ================= */
      document.getElementById("btnReset").addEventListener("click", function () {
        openModal(
          '<h3 id="modalTitle">はじめから やりなおす？</h3>' +
          '<p>コマも、おんぷも、ステッカーも<br />ぜんぶ はじめに もどります。</p>' +
          '<div class="modal-btns">' +
          '<button type="button" class="btn-sub" data-close>やめる</button>' +
          '<button type="button" class="btn-danger" id="btnDoReset">やりなおす</button></div>'
        );
        wireClose();
        document.getElementById("btnDoReset").addEventListener("click", function () {
          state = { pos: 0, rewards: {}, opened: {}, stickers: [] };
          simon = null;
          stopSnowStorm();
          try { window.localStorage.removeItem(LS_KEY); } catch (e) {}
          playTimers.forEach(clearTimeout); playTimers = []; playing = false;
          renderBoard(); renderStaff(-1); renderStickers();
          setMessage("はじめから スタート！ 1にちの マスを タップしてね");
          closeModal();
        });
      });

      /* ================= snow background ================= */
      (function makeSnow() {
        if (reduceMotion) return;
        var layer = document.getElementById("snowLayer");
        for (var i = 0; i < 22; i++) {
          var f = document.createElement("span");
          f.className = "snow";
          var sz = 4 + Math.random() * 6;
          f.style.width = sz + "px"; f.style.height = sz + "px";
          f.style.left = (Math.random() * 100) + "vw";
          f.style.animationDuration = (8 + Math.random() * 8) + "s";
          f.style.animationDelay = (-Math.random() * 14) + "s";
          f.style.opacity = (0.35 + Math.random() * 0.45).toFixed(2);
          layer.appendChild(f);
        }
      })();

      /* ================= init ================= */
      buildStaff();
      buildBoard();
      renderBoard();
      renderStaff(-1);
      renderStickers();
      if (state.pos >= 25) setMessage("ゴールずみ！ キャロルは かんせいしてるよ");
      else if (state.pos > 0) setMessage("おかえり！ つづきから あそべるよ");
      else setMessage("スタート！ 1にちの マスを タップして めくってね");
      requestAnimationFrame(function () { renderBoard(); });
    </script>
  </body>
</html>
